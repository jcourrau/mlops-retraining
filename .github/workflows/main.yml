name: CI model to dockerhub

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  retraining_model:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    container: docker://dvcorg/cml:latest
    env:
      repo_token: ${{ secrets.TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug path
        run: |
          echo "Path:" $GITHUB_WORKSPACE
          ls -la $GITHUB_WORKSPACE

      - name: Show file contents
        run: cat $GITHUB_WORKSPACE/requirements.txt

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install requirements
        run: pip3 install -r requirements.txt


      - name: Execute the training model
        run: |
          python3 retraining.py

      - name: Generating report
        run: |
          echo "## Model metrics" > report.md
          cat metrics.txt >> report.md
          
          echo "## Data visualization" >> report.md
          echo "![inline](feature_importance.png)" >> report.md
          
          cml comment create report.md

      - name: Upload report.md as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md

  build_docker_image:
    needs: retraining_model
    runs-on: ubuntu-latest

    steps:
      - name: Check the repo
        uses: actions/checkout@v4

      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN  }}

      - name: Build docker image
        run: docker build -t jcourrau/mlops_simple_workflow:dev .

      - name: Docker push to Dockerhub
        run: docker push jcourrau/mlops_simple_workflow:dev

      - name: Login into the server
        run: echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            docker login -u '${{ secrets.DOCKER_USERNAME }}' -p '${{ secrets.DOCKER_TOKEN }}'
            if docker ps --all | grep mlops_simple_workflow; then
              docker stop mlops_simple_workflow
              docker rm mlops_simple_workflow
            fi
            docker pull jcourrau/mlops_simple_workflow:dev
            docker run -d --name mlops_simple_workflow -p 8000:8000 jcourrau/mlops_simple_workflow:dev
